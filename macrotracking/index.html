<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>MacroTracking</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"></main>

<nav id="nav" aria-label="Navigazione principale">
  <button class="nav-btn" data-act="nav" data-view="diary" id="nav-diary">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zm3 4h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Diario</span>
  </button>
  <button class="nav-btn" data-act="nav" data-view="goals" id="nav-goals">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="currentColor" stroke-width="1.2"/></svg>
    <span>Obiettivi</span>
  </button>
  <button class="nav-btn" data-act="nav" data-view="weight" id="nav-weight">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11a2.5 2.5 0 0 1 2.4 1.8l1.6 11.4A3 3 0 0 1 18.5 20.5h-13a3 3 0 0 1-3-3.3L4.1 5.8A2.5 2.5 0 0 1 6.5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9.5a4.5 4.5 0 0 1 7 0M12 13l2-2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Peso</span>
  </button>
  <button class="nav-add" data-act="add-global" aria-label="Aggiungi alimento">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </button>
</nav>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Aggiungi alimento"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="foods.js"></script>
<script src="barcode.js"></script>
<script src="app.js"></script>
</body>
</html>
